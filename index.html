<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Strip EXIF"/>
<meta name="theme-color" content="#0f0f0f"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>Strip EXIF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f;--card:#181818;--card2:#212121;--border:#2c2c2c;--border2:#383838;
  --text:#f0f0f0;--muted:#777;--muted2:#4a4a4a;--accent:#4f9eff;
  --green:#30d158;--red:#ff453a;--yellow:#ffd60a;--radius:14px;--rs:10px
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;
  min-height:100dvh;padding-top:env(safe-area-inset-top);
  padding-bottom:calc(env(safe-area-inset-bottom)+1.5rem);display:flex;flex-direction:column}
header{padding:1.1rem 1.1rem .3rem;display:flex;align-items:center;gap:10px}
header h1{font-size:1.15rem;font-weight:600}
header .sub{font-size:.73rem;color:var(--muted);margin-top:2px}
main{flex:1;padding:.7rem 1rem 1.5rem;display:flex;flex-direction:column;gap:.85rem}

/* pick zone */
.pick{border:2px dashed var(--border2);border-radius:var(--radius);padding:1.8rem 1rem;
  text-align:center;cursor:pointer;background:var(--card);display:flex;
  flex-direction:column;align-items:center;gap:.4rem}
.pick:active{border-color:var(--accent)}
.pick .icon{font-size:1.9rem}
.pick strong{font-size:.92rem}
.pick p{color:var(--muted);font-size:.76rem;line-height:1.4}
#fileInput{display:none}

/* file grid */
.file-grid{display:flex;flex-direction:column;gap:6px}
.file-row{display:flex;align-items:center;gap:.6rem;background:var(--card);
  border-radius:var(--rs);padding:.5rem .65rem;border:1px solid var(--border)}
.file-icon{width:42px;height:42px;border-radius:7px;overflow:hidden;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--card2);font-size:1.3rem;position:relative}
.file-icon img{width:100%;height:100%;object-fit:cover;display:block}
.file-icon .ext-badge{position:absolute;bottom:0;right:0;background:#000;
  color:#fff;font-size:8px;font-weight:700;padding:1px 3px;border-radius:2px;
  text-transform:uppercase;line-height:1.2}
.file-info{flex:1;min-width:0}
.file-name{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.mtag{font-size:.65rem;padding:2px 5px;border-radius:4px;white-space:nowrap}
.mtag.img{background:#0d2233;color:#6ab4f5}
.mtag.pdf{background:#2a1010;color:#f58080}
.mtag.office{background:#0d2a12;color:#6adb80}
.mtag.odf{background:#1e1030;color:#b08af5}
.mtag.unknown{background:#1a1a1a;color:#666}
.file-rm{background:none;border:none;color:var(--muted);font-size:1rem;
  cursor:pointer;padding:4px;flex-shrink:0}

/* badge */
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--card);
  border:1px solid var(--border);border-radius:999px;padding:.28rem .75rem;
  font-size:.78rem;color:var(--muted)}
.badge b{color:var(--text)}

/* section */
.sec{display:flex;flex-direction:column;gap:.5rem}
.sec-label{font-size:.68rem;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em}

/* format pills — only for images */
.fmt-row{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.fmt-btn{padding:.6rem .5rem;border-radius:var(--rs);border:1.5px solid var(--border2);
  background:var(--card);color:var(--muted);font-size:.8rem;font-weight:500;
  cursor:pointer;text-align:center;transition:all .15s;line-height:1.3}
.fmt-btn .fsub{font-size:.68rem;color:var(--muted2);display:block;margin-top:2px}
.fmt-btn.active{border-color:var(--accent);color:var(--text);background:#0d2040}
.fmt-btn:active{opacity:.7}
.fmt-note{font-size:.73rem;color:var(--muted);padding:.1rem .1rem}

/* rename */
.rename-list{display:flex;flex-direction:column;gap:.4rem}
.rename-row{display:flex;align-items:center;gap:.5rem;background:var(--card);
  border-radius:var(--rs);padding:.45rem .65rem;border:1px solid var(--border)}
.rename-thumb{width:32px;height:32px;border-radius:5px;object-fit:cover;flex-shrink:0}
.rename-doc-icon{width:32px;height:32px;border-radius:5px;background:var(--card2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem}
.rename-input{flex:1;background:transparent;border:none;color:var(--text);
  font-size:.8rem;outline:none;min-width:0}
.rename-input::placeholder{color:var(--muted2)}
.rename-ext{font-size:.75rem;color:var(--muted);flex-shrink:0}

/* action row */
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.btn{padding:.85rem .5rem;border-radius:var(--radius);border:none;
  font-size:.88rem;font-weight:600;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  gap:3px;transition:opacity .15s;text-align:center;line-height:1.3}
.btn .bsub{font-size:.67rem;font-weight:400;opacity:.7}
.btn:active{opacity:.6}
.btn:disabled{opacity:.27;cursor:not-allowed}
.btn-save{background:var(--accent);color:#fff}
.btn-share{background:var(--card2);color:var(--text);border:1px solid var(--border2)}

/* progress */
.prog{display:none;flex-direction:column;gap:.4rem}
.prog.show{display:flex}
.bar-track{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .2s}
.prog-lbl{font-size:.73rem;color:var(--muted);text-align:center}

/* info */
.info{background:#0d2233;border:1px solid #1a3a55;border-radius:var(--rs);
  padding:.55rem .75rem;font-size:.76rem;color:#6ab4f5;line-height:1.55;display:none}
.info.show{display:block}

hr{border:none;border-top:1px solid var(--border)}

/* toast */
.toast{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(16px);background:#202020;
  border:1px solid var(--border2);border-radius:999px;padding:.4rem .95rem;
  font-size:.83rem;opacity:0;transition:all .25s;pointer-events:none;
  white-space:nowrap;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{color:var(--green)}.toast.err{color:var(--red)}

canvas{display:none}
</style>
</head>
<body>
<header>
  <span style="font-size:1.5rem">🧹</span>
  <div>
    <h1>Strip Metadata</h1>
    <div class="sub">Images · PDF · Word · Excel · PowerPoint · ODF — all metadata removed</div>
  </div>
</header>

<main>
  <!-- Pick -->
  <label class="pick" for="fileInput">
    <div class="icon">📂</div>
    <strong>Select any files</strong>
    <p>Photos, PDF, Word, Excel, PowerPoint, LibreOffice<br>All hidden metadata will be stripped</p>
  </label>
  <input type="file" id="fileInput" accept="*" multiple/>

  <div id="badge" class="badge" style="display:none">
    <b id="countLbl">0</b>&nbsp;file(s) &nbsp;·&nbsp;
    <span style="color:var(--accent);cursor:pointer" onclick="$('fileInput').click()">add more</span>
  </div>

  <div class="file-grid" id="fileGrid"></div>

  <!-- Image format (shown only when images present) -->
  <div class="sec" id="secFmt" style="display:none">
    <div class="sec-label">Image output format</div>
    <div class="fmt-row">
      <button class="fmt-btn active" data-fmt="jpeg">JPEG<span class="fsub">Smaller size</span></button>
      <button class="fmt-btn" data-fmt="png">PNG<span class="fsub">Lossless</span></button>
      <button class="fmt-btn" data-fmt="pdf-each">PDF — each<span class="fsub">One PDF per image</span></button>
      <button class="fmt-btn" data-fmt="pdf-merged">PDF — merged<span class="fsub">All images in one</span></button>
    </div>
    <div class="fmt-note" id="fmtNote"></div>
  </div>

  <!-- Rename -->
  <div class="sec" id="secRename" style="display:none">
    <div class="sec-label">Filenames &nbsp;<span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted2)">— tap to rename</span></div>
    <div class="rename-list" id="renameList"></div>
  </div>

  <!-- Progress -->
  <div class="prog" id="prog">
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="prog-lbl" id="progLbl">Processing…</div>
  </div>

  <!-- Info -->
  <div class="info" id="info"></div>

  <!-- Actions -->
  <div class="sec" id="secActions" style="display:none">
    <hr/>
    <div class="action-row" style="margin-top:.35rem">
      <button class="btn btn-save" id="btnSave">⬇️ Save<span class="bsub" id="saveHint">to Files</span></button>
      <button class="btn btn-share" id="btnShare">↗ Share<span class="bsub">AirDrop · Messages…</span></button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
let files = [], imgFmt = 'jpeg';

// ── File type detection ───────────────────────────────────────
const TYPE_INFO = {
  image:  { icon:'🖼️', cls:'img',
    tags:['📍 GPS & location','📷 Camera & lens','⏱ Timestamps','👤 Author','🔆 Aperture · ISO · shutter','📱 Device info','🖥 Software'] },
  pdf:    { icon:'📄', cls:'pdf',
    tags:['👤 Author','🏢 Creator app','⚙️ Producer','📅 Created & modified dates','📝 Title & subject','🔑 Keywords','🖨 Print settings'] },
  office: { icon:'📊', cls:'office',
    tags:['👤 Author','✏️ Last modified by','📅 Created & modified','🏢 Company','👔 Manager','💻 App name','📌 Template path'] },
  odf:    { icon:'📋', cls:'odf',
    tags:['👤 Initial creator','✏️ Last author','📅 Dates','⏳ Edit time & cycles','🏷 Keywords','🌐 Language'] },
  unknown:{ icon:'📎', cls:'unknown',
    tags:['⚠️ Unknown format — file returned as-is'] }
};

function detectType(file) {
  const n = file.name.toLowerCase(), m = file.type;
  if (m.startsWith('image/') || /\.(jpe?g|png|gif|webp|heic|tiff?|bmp|avif)$/.test(n)) return 'image';
  if (m==='application/pdf' || n.endsWith('.pdf')) return 'pdf';
  if (/\.(docx?|dotx?|pptx?|potx?|xlsx?|xltx?)$/.test(n)) return 'office';
  if (/\.(odt|ods|odp|odg|odf)$/.test(n)) return 'odf';
  return 'unknown';
}

function outputExt(file, type) {
  if (type !== 'image') return '.'+file.name.split('.').pop();
  if (imgFmt==='jpeg') return '.jpg';
  if (imgFmt==='png')  return '.png';
  return '.pdf';
}

// ── Render file list ──────────────────────────────────────────
function render() {
  const n = files.length;
  $('badge').style.display = n ? 'inline-flex' : 'none';
  $('countLbl').textContent = n;

  const fg = $('fileGrid'); fg.innerHTML = '';
  let hasImages = false, hasDocs = false;

  files.forEach((f, i) => {
    const type = detectType(f);
    if (type === 'image') hasImages = true; else hasDocs = true;
    const info = TYPE_INFO[type];
    const isImg = type === 'image';
    const previewUrl = isImg ? URL.createObjectURL(f) : null;

    const row = document.createElement('div'); row.className = 'file-row';
    const iconHtml = isImg
      ? `<div class="file-icon"><img src="${previewUrl}"/></div>`
      : `<div class="file-icon">${info.icon}<span class="ext-badge">${f.name.split('.').pop()}</span></div>`;

    const tagsHtml = info.tags.map(t =>
      `<span class="mtag ${info.cls}">${t}</span>`).join('');

    row.innerHTML = `${iconHtml}
      <div class="file-info">
        <div class="file-name">${f.name}</div>
        <div class="file-meta-tags">${tagsHtml}</div>
      </div>
      <button class="file-rm" data-i="${i}" title="Remove">✕</button>`;
    fg.appendChild(row);
  });

  fg.querySelectorAll('.file-rm').forEach(b => b.addEventListener('click', () => {
    files.splice(+b.dataset.i, 1); render();
  }));

  // Image format section — show only when images present
  $('secFmt').style.display = hasImages ? 'flex' : 'none';
  if (hasDocs && hasImages) {
    $('fmtNote').textContent = '* Documents are always saved as their original format (metadata stripped).';
  } else {
    $('fmtNote').textContent = '';
  }

  $('secRename').style.display = n ? 'flex' : 'none';
  $('secActions').style.display = n ? 'flex' : 'none';
  $('info').classList.remove('show');

  buildRenameList();
  updateSaveHint();
}

// ── Format picker ─────────────────────────────────────────────
document.querySelectorAll('.fmt-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.fmt-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); imgFmt = b.dataset.fmt;
    buildRenameList(); updateSaveHint();
  });
});

function updateSaveHint() {
  const hasImages = files.some(f => detectType(f)==='image');
  const hasDocs   = files.some(f => detectType(f)!=='image');
  let hint = 'to Files';
  if (hasImages && !hasDocs) {
    hint = imgFmt.startsWith('pdf') ? 'PDF → Files' : (imgFmt==='jpeg'?'JPG → Files/Photos':'PNG → Files');
  } else if (hasDocs && !hasImages) {
    hint = 'cleaned files → Files';
  } else {
    hint = 'all files → Files';
  }
  $('saveHint').textContent = hint;
}

// ── Rename list ───────────────────────────────────────────────
function buildRenameList() {
  const list = $('renameList'); list.innerHTML = '';
  const isMerged = imgFmt === 'pdf-merged';
  const docFiles = files.filter(f => detectType(f) !== 'image');
  const imgFiles = files.filter(f => detectType(f) === 'image');

  if (isMerged && imgFiles.length) {
    // Single merged PDF entry
    list.appendChild(makeRenameRow(null, '📄', 'merged_photos', '.pdf', 'merged-pdf'));
  } else {
    files.forEach((f, i) => {
      const type = detectType(f);
      const isImg = type === 'image';
      const base = f.name.replace(/\.[^.]+$/, '') + '_clean';
      const ext  = outputExt(f, type);
      const preview = isImg ? URL.createObjectURL(f) : null;
      const icon = TYPE_INFO[type].icon;
      list.appendChild(makeRenameRow(preview, icon, base, ext, i));
    });
  }
}

function makeRenameRow(imgSrc, icon, defaultName, extension, key) {
  const row = document.createElement('div'); row.className = 'rename-row';
  const thumb = imgSrc
    ? `<img class="rename-thumb" src="${imgSrc}"/>`
    : `<div class="rename-doc-icon">${icon}</div>`;
  row.innerHTML = `${thumb}
    <input class="rename-input" data-key="${key}" value="${defaultName}" placeholder="${defaultName}"/>
    <span class="rename-ext">${extension}</span>`;
  return row;
}

function getName(key) {
  const el = document.querySelector(`.rename-input[data-key="${key}"]`);
  return (el && el.value.trim()) ? el.value.trim() : (el ? el.placeholder : 'file');
}

// ── Progress ──────────────────────────────────────────────────
function showProg(show) {
  $('prog').classList.toggle('show', show);
  [$('btnSave'),$('btnShare')].forEach(b=>b.disabled=show);
}
function setProg(n, total, label) {
  $('barFill').style.width=`${Math.round((n/total)*100)}%`;
  $('progLbl').textContent=label;
}
function toast(msg,type='ok'){
  const t=$('toast'); t.textContent=msg; t.className=`toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'),3200);
}
function showInfo(msg){
  const el=$('info'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),7000);
}
function download(blob, name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function readAsArrayBuffer(file){
  return new Promise((res,rej)=>{
    const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej;
    r.readAsArrayBuffer(file);
  });
}
function blobToDataUrl(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej;
    r.readAsDataURL(blob);
  });
}

// ── Strip: Image (canvas redraw) ──────────────────────────────
function stripImage(file, outFmt='jpeg', quality=0.92){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if(outFmt!=='png'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);}
      ctx.drawImage(img,0,0); URL.revokeObjectURL(url);
      const mime=outFmt==='png'?'image/png':'image/jpeg';
      canvas.toBlob(b=>b?res(b):rej('toBlob failed'),mime,outFmt==='png'?undefined:quality);
    };
    img.onerror=rej; img.src=url;
  });
}

// ── Strip: PDF (pdf-lib — clear all info dict fields) ─────────
async function stripPdf(file){
  const ab = await readAsArrayBuffer(file);
  const PDFLib = window.PDFLib;
  const pdfDoc = await PDFLib.PDFDocument.load(ab, { ignoreEncryption: true });

  // Clear all standard info dict fields
  pdfDoc.setTitle('');
  pdfDoc.setAuthor('');
  pdfDoc.setSubject('');
  pdfDoc.setKeywords([]);
  pdfDoc.setProducer('');
  pdfDoc.setCreator('');
  pdfDoc.setCreationDate(new Date(0));
  pdfDoc.setModificationDate(new Date(0));

  // Also clear XMP metadata stream if present
  try {
    const infoDict = pdfDoc.getInfoDict && pdfDoc.getInfoDict();
    if (infoDict) infoDict.entries().forEach(([k])=>infoDict.delete(k));
  } catch(e){}

  const bytes = await pdfDoc.save();
  return new Blob([bytes],{type:'application/pdf'});
}

// ── Strip: Office / ODF (JSZip — clear docProps XML) ──────────
const BLANK_CORE = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
<dc:creator></dc:creator><cp:lastModifiedBy></cp:lastModifiedBy>
<dcterms:created xsi:type="dcterms:W3CDTF">1970-01-01T00:00:00Z</dcterms:created>
<dcterms:modified xsi:type="dcterms:W3CDTF">1970-01-01T00:00:00Z</dcterms:modified>
</cp:coreProperties>`;

const BLANK_APP = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties">
<Application></Application><Company></Company><Manager></Manager>
</Properties>`;

const BLANK_ODF_META = `<?xml version="1.0" encoding="UTF-8"?>
<office:document-meta xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0"
  xmlns:meta="urn:oasis:names:tc:opendocument:xmlns:meta:1.0"
  xmlns:dc="http://purl.org/dc/elements/1.1/">
<office:meta>
<dc:creator></dc:creator><dc:date>1970-01-01T00:00:00</dc:date>
</office:meta>
</office:document-meta>`;

async function stripOffice(file){
  const ab = await readAsArrayBuffer(file);
  const zip = await JSZip.loadAsync(ab);

  // Clear or replace metadata files
  if (zip.file('docProps/core.xml'))   zip.file('docProps/core.xml', BLANK_CORE);
  if (zip.file('docProps/app.xml'))    zip.file('docProps/app.xml', BLANK_APP);
  if (zip.file('docProps/custom.xml')) zip.remove('docProps/custom.xml');

  // Also try to remove embedded thumbnail
  if (zip.file('docProps/thumbnail.emf')) zip.remove('docProps/thumbnail.emf');
  if (zip.file('docProps/thumbnail.jpeg')) zip.remove('docProps/thumbnail.jpeg');
  if (zip.file('docProps/thumbnail.png')) zip.remove('docProps/thumbnail.png');

  const outBlob = await zip.generateAsync({
    type:'blob', mimeType: file.type || 'application/octet-stream',
    compression:'DEFLATE', compressionOptions:{level:6}
  });
  return outBlob;
}

async function stripOdf(file){
  const ab = await readAsArrayBuffer(file);
  const zip = await JSZip.loadAsync(ab);
  if (zip.file('meta.xml')) zip.file('meta.xml', BLANK_ODF_META);
  if (zip.file('Thumbnails/thumbnail.png')) zip.remove('Thumbnails/thumbnail.png');
  const outBlob = await zip.generateAsync({
    type:'blob', mimeType: file.type || 'application/octet-stream',
    compression:'DEFLATE', compressionOptions:{level:6}
  });
  return outBlob;
}

async function stripAny(file){
  const type = detectType(file);
  if (type==='image')  return { blob: await stripImage(file,'jpeg'), type };
  if (type==='pdf')    return { blob: await stripPdf(file), type };
  if (type==='office') return { blob: await stripOffice(file), type };
  if (type==='odf')    return { blob: await stripOdf(file), type };
  return { blob: file, type:'unknown' }; // pass-through
}

// ── Build all output blobs ────────────────────────────────────
async function buildBlobs(onProg){
  const { jsPDF } = window.jspdf;
  const results=[];
  const isMerged = imgFmt==='pdf-merged';
  const imgFiles = files.filter(f=>detectType(f)==='image');
  const otherFiles = files.filter(f=>detectType(f)!=='image');

  if (isMerged && imgFiles.length) {
    // Merge all images into one PDF
    let pdf=null;
    for (let i=0; i<imgFiles.length; i++){
      onProg(i, files.length, `Image ${i+1} of ${imgFiles.length} → PDF…`);
      const blob = await stripImage(imgFiles[i],'jpeg',0.88);
      const dataUrl = await blobToDataUrl(blob);
      const iw=canvas.width,ih=canvas.height,land=iw>ih;
      const pw=land?842:595,ph=land?595:842,mg=24;
      const sc=Math.min((pw-mg*2)/iw,(ph-mg*2)/ih);
      if(!pdf) pdf=new jsPDF({unit:'pt',format:[pw,ph],orientation:land?'l':'p'});
      else pdf.addPage([pw,ph],land?'l':'p');
      pdf.addImage(dataUrl,'JPEG',(pw-iw*sc)/2,(ph-ih*sc)/2,iw*sc,ih*sc);
    }
    onProg(imgFiles.length,files.length,'Building merged PDF…');
    results.push({blob:pdf.output('blob'), name:getName('merged-pdf')+'.pdf', mime:'application/pdf'});

    // Process remaining docs
    for (let i=0;i<otherFiles.length;i++){
      const idx=imgFiles.length+i;
      onProg(idx,files.length,`Stripping ${otherFiles[i].name}…`);
      const {blob}=await stripAny(otherFiles[i]);
      const ext='.'+otherFiles[i].name.split('.').pop();
      const fi=files.indexOf(otherFiles[i]);
      results.push({blob,name:getName(fi)+ext,mime:otherFiles[i].type||'application/octet-stream'});
    }

  } else {
    // Process each file individually
    for (let i=0;i<files.length;i++){
      const f=files[i];
      const type=detectType(f);
      onProg(i,files.length,`Processing ${i+1} of ${files.length}: ${f.name}…`);

      if (type==='image' && (imgFmt==='jpeg'||imgFmt==='png')) {
        const blob=await stripImage(f,imgFmt==='png'?'png':'jpeg');
        const ext=imgFmt==='png'?'.png':'.jpg';
        results.push({blob,name:getName(i)+ext,mime:imgFmt==='png'?'image/png':'image/jpeg'});
      } else if (type==='image' && imgFmt==='pdf-each') {
        const blob=await stripImage(f,'jpeg',0.88);
        const dataUrl=await blobToDataUrl(blob);
        const iw=canvas.width,ih=canvas.height,land=iw>ih;
        const pw=land?842:595,ph=land?595:842,mg=24;
        const sc=Math.min((pw-mg*2)/iw,(ph-mg*2)/ih);
        const pdf=new jsPDF({unit:'pt',format:[pw,ph],orientation:land?'l':'p'});
        pdf.addImage(dataUrl,'JPEG',(pw-iw*sc)/2,(ph-ih*sc)/2,iw*sc,ih*sc);
        results.push({blob:pdf.output('blob'),name:getName(i)+'.pdf',mime:'application/pdf'});
      } else {
        const {blob}=await stripAny(f);
        const ext='.'+f.name.split('.').pop();
        results.push({blob,name:getName(i)+ext,mime:f.type||'application/octet-stream'});
      }
    }
  }
  onProg(files.length,files.length,'Done ✓');
  return results;
}

// ── Save ──────────────────────────────────────────────────────
$('btnSave').addEventListener('click', async()=>{
  showProg(true);
  try {
    const blobs=await buildBlobs(setProg);
    for(let i=0;i<blobs.length;i++){
      download(blobs[i].blob,blobs[i].name);
      if(i<blobs.length-1) await new Promise(r=>setTimeout(r,450));
    }
    toast(`✅ ${blobs.length} file(s) saved`);
    const hasImg=files.some(f=>detectType(f)==='image');
    if(hasImg&&(imgFmt==='jpeg'||imgFmt==='png'))
      showInfo('📌 iPhone: open in Files → tap Share → Save Image to add to Photos.');
  } catch(e){toast('Something went wrong','err');console.error(e);}
  showProg(false);
});

// ── Share ─────────────────────────────────────────────────────
$('btnShare').addEventListener('click', async()=>{
  showProg(true);
  try {
    const blobs=await buildBlobs(setProg);
    const shareFiles=blobs.map(b=>new File([b.blob],b.name,{type:b.mime}));
    if(navigator.canShare&&navigator.canShare({files:shareFiles})){
      await navigator.share({files:shareFiles,title:'Metadata-free files'});
      toast(`✅ Shared ${shareFiles.length} file(s)`);
    } else {
      for(const b of blobs){download(b.blob,b.name);await new Promise(r=>setTimeout(r,450));}
      toast(`✅ ${blobs.length} file(s) downloaded`);
      showInfo('💡 Share via AirDrop or Messages: open the downloaded file and tap Share.');
    }
  } catch(e){
    if(e.name!=='AbortError'){toast('Something went wrong','err');console.error(e);}
  }
  showProg(false);
});

$('fileInput').addEventListener('change',e=>{
  files=files.concat(Array.from(e.target.files));
  $('fileInput').value=''; render();
});

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

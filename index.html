<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Strip EXIF"/>
<meta name="theme-color" content="#0f0f0f"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>Strip EXIF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f;--card:#1a1a1a;--border:#2a2a2a;
  --text:#f0f0f0;--muted:#888;--accent:#4f9eff;
  --green:#34c759;--red:#ff453a;--yellow:#ffd60a;--radius:14px
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;
  min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 1rem);
  display:flex;flex-direction:column}
header{padding:1.2rem 1.2rem .4rem;display:flex;align-items:center;gap:10px}
header h1{font-size:1.25rem;font-weight:600}
header .sub{font-size:.8rem;color:var(--muted);margin-top:1px}
main{flex:1;padding:.75rem 1rem 2rem;display:flex;flex-direction:column;gap:.9rem}

/* pick zone */
.pick{border:2px dashed var(--border);border-radius:var(--radius);
  padding:2.2rem 1rem;text-align:center;cursor:pointer;transition:border-color .2s;
  display:flex;flex-direction:column;align-items:center;gap:.5rem;background:var(--card)}
.pick:active{border-color:var(--accent)}
.pick .icon{font-size:2.2rem}
.pick p{color:var(--muted);font-size:.85rem}
.pick strong{font-size:.95rem;color:var(--text)}
#fileInput{display:none}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);
  border:none;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}

/* badge */
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--card);
  border:1px solid var(--border);border-radius:999px;padding:.3rem .8rem;
  font-size:.82rem;color:var(--muted)}
.badge b{color:var(--text)}

/* section label */
.section-label{font-size:.75rem;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;padding:0 .1rem}

/* action buttons */
.actions{display:flex;flex-direction:column;gap:.6rem}
.btn{width:100%;padding:.85rem 1rem;border-radius:var(--radius);border:none;
  font-size:.95rem;font-weight:600;cursor:pointer;display:flex;
  align-items:center;justify-content:center;gap:.5rem;transition:opacity .15s;text-align:left}
.btn:active{opacity:.65}
.btn-photos{background:var(--accent);color:#fff}
.btn-pdf-one{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-pdf-each{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-pdf-merged{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn .desc{font-size:.75rem;font-weight:400;color:rgba(255,255,255,.65);display:block;margin-top:1px}
.btn-pdf-one .desc,.btn-pdf-each .desc,.btn-pdf-merged .desc{color:var(--muted)}

/* divider */
.divider{height:1px;background:var(--border);margin:.1rem 0}

/* progress */
.progress{display:none;flex-direction:column;gap:.5rem}
.progress.show{display:flex}
.bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:3px;width:0%;transition:width .25s}
.prog-label{font-size:.78rem;color:var(--muted);text-align:center}

/* ios hint */
.ios-hint{display:none;background:#1c2a1c;border:1px solid #2a4a2a;border-radius:10px;
  padding:.7rem .9rem;font-size:.8rem;color:#86c986;line-height:1.5}
.ios-hint.show{display:block}

/* toast */
.toast{position:fixed;bottom:calc(1.5rem + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(20px);background:#222;
  border:1px solid var(--border);border-radius:999px;padding:.5rem 1.1rem;
  font-size:.88rem;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{color:var(--green)}
.toast.err{color:var(--red)}

canvas{display:none}
</style>
</head>
<body>

<header>
  <span style="font-size:1.6rem">🧹</span>
  <div>
    <h1>Strip EXIF</h1>
    <div class="sub">Remove metadata · Save to Photos or Files</div>
  </div>
</header>

<main>
  <label class="pick" for="fileInput">
    <div class="icon">🖼️</div>
    <strong>Select photos</strong>
    <p>Tap to pick one or more images from your library</p>
  </label>
  <input type="file" id="fileInput" accept="image/*" multiple/>

  <div id="badge" class="badge" style="display:none">
    <b id="countLabel">0</b>&nbsp;photo(s) selected
  </div>

  <div class="grid" id="grid"></div>

  <div class="progress" id="progress">
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="prog-label" id="progLabel">Processing…</div>
  </div>

  <div id="actions" style="display:none">
    <div class="section-label" style="margin-bottom:.5rem">Save to Photos</div>
    <div class="actions">
      <button class="btn btn-photos" id="btnPhotos">
        📸 Save as JPG to Photos
        <span class="desc">Strips EXIF · share sheet opens for each photo</span>
      </button>
    </div>

    <div class="divider" style="margin:.8rem 0"></div>

    <div class="section-label" style="margin-bottom:.5rem">Save to Files</div>
    <div class="actions">
      <button class="btn btn-pdf-merged" id="btnPdfMerged">
        📄 One merged PDF
        <span class="desc">All photos in a single PDF file</span>
      </button>
      <button class="btn btn-pdf-each" id="btnPdfEach">
        🗂️ Individual PDFs
        <span class="desc">One PDF per photo</span>
      </button>
    </div>
  </div>

  <div class="ios-hint" id="iosHint">
    📌 When the share sheet opens — tap <strong>Save Image</strong> to add to your Photos library.
    Repeat for each photo.
  </div>
</main>

<div class="toast" id="toast"></div>
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const fileInput = $('fileInput'), grid = $('grid'), badge = $('badge');
const countLabel = $('countLabel'), actions = $('actions');
const btnPhotos = $('btnPhotos'), btnPdfMerged = $('btnPdfMerged'), btnPdfEach = $('btnPdfEach');
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const progress = $('progress'), barFill = $('barFill'), progLabel = $('progLabel');
const iosHint = $('iosHint');

let files = [];

fileInput.addEventListener('change', e => {
  files = files.concat(Array.from(e.target.files));
  render(); fileInput.value = '';
});

function render() {
  grid.innerHTML = '';
  files.forEach((f, i) => {
    const url = URL.createObjectURL(f);
    const d = document.createElement('div'); d.className = 'thumb';
    d.innerHTML = `<img src="${url}"/><button class="rm" data-i="${i}">✕</button>`;
    grid.appendChild(d);
  });
  grid.querySelectorAll('.rm').forEach(b => b.addEventListener('click', () => {
    files.splice(+b.dataset.i, 1); render();
  }));
  const n = files.length;
  badge.style.display = n ? 'inline-flex' : 'none';
  countLabel.textContent = n;
  actions.style.display = n ? 'block' : 'none';
  iosHint.classList.remove('show');
}

// Draw to canvas → JPEG blob (strips all EXIF)
function stripExif(file, quality = 0.92) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => b ? res(b) : rej('toBlob failed'), 'image/jpeg', quality);
    };
    img.onerror = rej; img.src = url;
  });
}

function blobToDataUrl(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

function showProgress(show) {
  progress.classList.toggle('show', show);
  [btnPhotos, btnPdfMerged, btnPdfEach].forEach(b => b.disabled = show);
}
function setProgress(n, total, label) {
  barFill.style.width = `${Math.round((n/total)*100)}%`;
  progLabel.textContent = label;
}
function toast(msg, type='ok') {
  const t = $('toast'); t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// ── Photos: use Web Share API so iOS shows share sheet → Save Image ──
btnPhotos.addEventListener('click', async () => {
  showProgress(true); iosHint.classList.remove('show');
  try {
    for (let i = 0; i < files.length; i++) {
      setProgress(i, files.length, `Processing ${i+1} of ${files.length}…`);
      const blob = await stripExif(files[i]);
      const name = files[i].name.replace(/\.[^.]+$/, '') + '_clean.jpg';
      const shareFile = new File([blob], name, { type: 'image/jpeg' });

      if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
        iosHint.classList.add('show');
        await navigator.share({ files: [shareFile], title: 'Clean photo' });
        await new Promise(r => setTimeout(r, 600));
      } else {
        // fallback: direct download
        download(blob, name);
        await new Promise(r => setTimeout(r, 400));
      }
    }
    setProgress(files.length, files.length, 'Done');
    toast(`✅ ${files.length} photo(s) shared`);
  } catch(e) {
    if (e.name !== 'AbortError') { toast('Something went wrong', 'err'); console.error(e); }
  }
  showProgress(false);
});

// ── One merged PDF → Files ──
btnPdfMerged.addEventListener('click', async () => {
  showProgress(true);
  try {
    const { jsPDF } = window.jspdf; let pdf = null;
    for (let i = 0; i < files.length; i++) {
      setProgress(i, files.length, `Adding page ${i+1} of ${files.length}…`);
      const blob = await stripExif(files[i], 0.88);
      const dataUrl = await blobToDataUrl(blob);
      const iw = canvas.width, ih = canvas.height;
      const landscape = iw > ih;
      const pw = landscape ? 842 : 595, ph = landscape ? 595 : 842;
      const margin = 24;
      const scale = Math.min((pw-margin*2)/iw, (ph-margin*2)/ih);
      const w = iw*scale, h = ih*scale;
      const x = (pw-w)/2, y = (ph-h)/2;
      if (!pdf) pdf = new jsPDF({ unit:'pt', format:[pw,ph], orientation: landscape?'l':'p' });
      else { pdf.addPage([pw,ph], landscape?'l':'p'); }
      pdf.addImage(dataUrl, 'JPEG', x, y, w, h);
    }
    setProgress(files.length, files.length, 'Building PDF…');
    download(pdf.output('blob'), 'photos_clean.pdf');
    toast(`✅ Merged PDF (${files.length} pages) → Files`);
  } catch(e) { toast('Something went wrong','err'); console.error(e); }
  showProgress(false);
});

// ── Individual PDFs → Files ──
btnPdfEach.addEventListener('click', async () => {
  showProgress(true);
  try {
    const { jsPDF } = window.jspdf;
    for (let i = 0; i < files.length; i++) {
      setProgress(i, files.length, `PDF ${i+1} of ${files.length}…`);
      const blob = await stripExif(files[i], 0.88);
      const dataUrl = await blobToDataUrl(blob);
      const iw = canvas.width, ih = canvas.height;
      const landscape = iw > ih;
      const pw = landscape ? 842 : 595, ph = landscape ? 595 : 842;
      const margin = 24;
      const scale = Math.min((pw-margin*2)/iw, (ph-margin*2)/ih);
      const w = iw*scale, h = ih*scale;
      const x = (pw-w)/2, y = (ph-h)/2;
      const pdf = new jsPDF({ unit:'pt', format:[pw,ph], orientation: landscape?'l':'p' });
      pdf.addImage(dataUrl, 'JPEG', x, y, w, h);
      const name = files[i].name.replace(/\.[^.]+$/, '') + '_clean.pdf';
      download(pdf.output('blob'), name);
      await new Promise(r => setTimeout(r, 500));
    }
    setProgress(files.length, files.length, 'Done');
    toast(`✅ ${files.length} PDFs → Files`);
  } catch(e) { toast('Something went wrong','err'); console.error(e); }
  showProgress(false);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
